name: Build Card Studio macOS 1.2.3 (build 2)

on:
  workflow_dispatch:
  push:
    branches:
      - card-studio-1.2.3-real-api

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install macOS build dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install python pkg-config gobject-introspection pygobject3 gtk4 libadwaita swig

      - name: Install runner test dependencies including JPype
        run: |
          BREW_PYTHON="$(brew --prefix python)/bin/python3"
          VENV=".venv-macos-$(uname -m)"
          "$BREW_PYTHON" -m venv --system-site-packages "$VENV"
          "$VENV/bin/pip" install pytest -r requirements.txt
          "$VENV/bin/python" -c 'import jpype; print("JPype", jpype.__version__)'
          java -version

      - name: Verify GlobalPlatform runtime in development
        run: |
          set -euo pipefail
          VENV=".venv-macos-$(uname -m)"
          mkdir -p "$PWD/artifacts" "$PWD/runner-home"
          HOME="$PWD/runner-home" "$VENV/bin/python" -m card_studio --cli globalplatform-status > "$PWD/artifacts/globalplatform-status-development.json"

      - name: Run complete pytest regression
        run: .venv-macos-$(uname -m)/bin/python -m pytest -q tests

      - name: Run regression and build signed app
        run: ./packaging/macos/build.sh

      - name: Verify app and create PACO artifacts
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          DIST="$PWD/dist/macos-$ARCH"
          APP="$DIST/Swift Ledger Card Studio.app"
          EXECUTABLE="$APP/Contents/MacOS/Swift Ledger Card Studio"
          OUT="$PWD/artifacts"
          DMG="Card-Studio-1.2.3-PACO-macOS.dmg"
          ZIP="Card-Studio-1.2.3-PACO-macOS.zip"
          mkdir -p "$OUT" "$PWD/runner-home"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          test "$VERSION" = "1.2.3"
          test "$BUILD" = "2"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2> "$OUT/codesign.txt"

          HOME="$PWD/runner-home" "$EXECUTABLE" --cli globalplatform-status > "$OUT/globalplatform-status-app.json"
          python3 - "$APP" "$OUT/globalplatform-status-app.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          app = Path(sys.argv[1]).resolve()
          report = json.loads(Path(sys.argv[2]).read_text())
          assert report["status"] == "PASS", report
          assert report["jpype"]["imported"] is True, report
          assert report["jvm"]["started"] is True, report
          assert report["classes"] == {
              "apdu4j.core.BIBO": True,
              "pro.javacard.gptool.GPTool": True,
          }, report
          assert report["pcsc"] == "NOT_OPENED", report
          assert report["apdus"] == "NOT_SENT", report
          gp_jar = Path(report["gp_jar"]["path"]).resolve()
          gp_jar.relative_to(app)
          assert gp_jar.is_file(), gp_jar
          print(f"GLOBALPLATFORM_APP=PASS GP_JAR={gp_jar}")
          PY

          HOME="$PWD/runner-home" "$EXECUTABLE" --cli diagnose > "$OUT/diagnose.txt"
          HOME="$PWD/runner-home" "$EXECUTABLE" --cli hardware-validation --dry-run --evidence "$OUT/dry-run-evidence.json" > "$OUT/dry-run.json"

          open -n "$APP"
          sleep 10
          pgrep -f "$EXECUTABLE" >/dev/null
          pkill -f "$EXECUTABLE" || true
          printf 'GUI_LAUNCH=PASS\n' > "$OUT/launch.txt"

          cp "$DIST/Card-Studio-$VERSION-macOS-$ARCH.dmg" "$OUT/$DMG"
          hdiutil verify "$OUT/$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/$ZIP"
          unzip -t "$OUT/$ZIP"

          python3 - "$OUT/build-info.json" "$VERSION" "$BUILD" "$ARCH" <<'PY'
          import json
          import os
          import sys

          path, version, build, arch = sys.argv[1:]
          with open(path, "w") as handle:
              json.dump({
                  "version": version,
                  "build": int(build),
                  "architecture": arch,
                  "source_commit": os.environ["GITHUB_SHA"],
                  "github_run_id": os.environ["GITHUB_RUN_ID"],
                  "signature": "ad hoc",
                  "notarization": "NOT_EXECUTED",
                  "physical_card_validation": "NOT_EXECUTED",
              }, handle, indent=2)
              handle.write("\n")
          PY

          (cd "$OUT" && shasum -a 256 "$DMG" "$ZIP" > SHA256SUMS)
          cat "$OUT/SHA256SUMS"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Card-Studio-1.2.3-PACO-macOS
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

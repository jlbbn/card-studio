<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

  <defs>

    <!-- Red base -->
    <linearGradient id="redBase"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%"
            stop-color="#26070d"/>
      <stop offset="52%"
            stop-color="#74101d"/>
      <stop offset="100%"
            stop-color="#a8192a"/>
    </linearGradient>

    <!-- Carbon weave -->
    <pattern id="carbon"
             width="18"
             height="18"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">

      <rect width="18"
            height="18"
            fill="#000000"
            opacity="0.04"/>

      <rect x="0"
            y="0"
            width="8"
            height="18"
            fill="#ffffff"
            opacity="0.065"/>

      <rect x="9"
            y="0"
            width="8"
            height="18"
            fill="#000000"
            opacity="0.085"/>

      <path d="M0 0 H18"
            stroke="#ffffff"
            stroke-width="1"
            opacity="0.025"/>

    </pattern>

    <!-- Soft resin highlight -->
    <linearGradient id="shine"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%"
            stop-color="#ffffff"
            stop-opacity="0.055"/>
      <stop offset="42%"
            stop-color="#ffffff"
            stop-opacity="0"/>
      <stop offset="100%"
            stop-color="#000000"
            stop-opacity="0.08"/>
    </linearGradient>

  </defs>

  <rect width="1200"
        height="420"
        fill="url(#redBase)"/>

  <rect width="1200"
        height="420"
        fill="url(#carbon)"
        opacity="0.48"/>

  <rect width="1200"
        height="420"
        fill="url(#shine)"/>

</svg>
